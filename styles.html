<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TV-Serien</title>

  <!-- Font Awesome (deins) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" rel="stylesheet">

  <style>
    /* ===== Layout: Header / Footer / Grundlayout ===== */
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      background:#f6f7fb;
      color:#111;
    }
    header,footer{
      padding:14px 18px;
      background:#111;
      color:#fff;
    }
    header a, footer a{ color:#fff; text-decoration:none; }
    .wrap{
      max-width:1100px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }
    .brand{
      font-weight:800;
      letter-spacing:.2px;
      font-size:18px;
    }
    nav{ display:flex; gap:10px; flex-wrap:wrap; }
    nav a{
      padding:8px 10px;
      border-radius:10px;
    }
    nav a:hover{ background:rgba(255,255,255,.12); }

    .search{
      display:flex;
      gap:8px;
      align-items:center;
      flex:1;
      min-width:240px;
      max-width:520px;
    }
    .search input[type="search"]{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #ddd;
      outline:none;
    }
    .search button{
      padding:10px 14px;
      border-radius:10px;
      border:0;
      background:#2d6cdf;
      color:#fff;
      cursor:pointer;
      white-space:nowrap;
    }
    .search button:hover{ filter:brightness(.95); }

    main{
      flex:1;
      max-width:1100px;
      width:100%;
      margin:0 auto;
      padding:24px 18px;
    }

    /* ===== Dein bestehendes CSS: Grid / Cards / Tags ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      transition: transform .08s ease, box-shadow .08s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,.12);
    }
    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
    }
    .card .t {
      padding: 6px 8px;
      font-size: .9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card .m {
      padding: 0 8px 8px;
      color: #666;
      font-size: .8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fa-solid,
    .fa-regular {
      color: gold;
      font-size: 24px;
    }
    .random-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, 140px);
      justify-content: center;
      gap: 14px;
      margin: 0 auto;
    }
    .tag {
      display: inline-block;
      background-color: rgb(240, 240, 242);
      color: black;
      padding: 5px;
      margin: 2px;
      margin-bottom: 10px;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <!-- Name der Seite + Link zur Startseite -->
      <a class="brand" href="index.html">TV-Serien</a>

      <!-- Suchleiste -->
      <form class="search" action="index.html" method="get" role="search">
        <input type="search" name="q" placeholder="Serie suchen…" aria-label="Serie suchen" />
        <button type="submit">Suchen</button>
      </form>

      <!-- 2 Unterseiten -->
      <nav aria-label="Hauptnavigation">
        <a href="seite1.html">Unterseite 1</a>
        <a href="seite2.html">Unterseite 2</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- Hier kommt euer Grid rein (Beispiel) -->
    <h1 style="margin-top:0;">Ergebnisse</h1>

    <div class="grid">
      <a class="card" href="detail.html?id=1">
        <img src="https://via.placeholder.com/300x450" alt="poster" loading="lazy">
        <div class="t">Beispiel-Serie</div>
        <div class="m"><i class="fa-solid fa-star"></i> 8.5</div>
      </a>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <a class="brand" href="index.html">TV-Serien</a>
      <span style="opacity:.8;">© <script>document.write(new Date().getFullYear())</script></span>
    </div>
  </footer>
</body>
</html>
